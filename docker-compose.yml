services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - appnet

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    networks:
      - appnet

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: auth-service
    env_file:
      - .env
    environment:
      PORT: ${AUTH_PORT:-5000}
      MONGO_URI: ${AUTH_MONGO_URI}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      NODE_ENV: production
    ports:
      - "${AUTH_PORT:-5000}:${AUTH_PORT:-5000}"
    restart: unless-stopped
    networks:
      - appnet

  restaurant-service:
    build:
      context: ./backend/restaurant-service
    container_name: restaurant-service
    env_file:
      - .env
    environment:
      PORT: ${REST_PORT:-5002}
      MONGO_URI: ${RESTAURANT_MONGO_URI}
      RESTAURANT_DB_NAME: ${RESTAURANT_DB_NAME}
      NODE_ENV: production
    ports:
      - "${REST_PORT:-5002}:${REST_PORT:-5002}"
    restart: unless-stopped
    networks:
      - appnet

  order-service:
    build:
      context: ./backend/order-service
    container_name: order-service
    env_file:
      - .env
    environment:
      PORT: ${ORDER_PORT:-5005}
      MONGO_URI: ${ORDER_MONGO_URI}
      ORDER_DB_NAME: ${ORDER_DB_NAME}
      NODE_ENV: production
      REALTIME_SERVICE_URL: ${REALTIME_URL:-http://realtime-gateway:5050}
      SERVICE_INTERNAL_KEY: ${SERVICE_INTERNAL_KEY:-super-admin-internal-key}
      RABBITMQ_URL: amqp://rabbitmq:5672
      PROMOTION_SERVICE_URL: ${PROMOTION_INTERNAL_URL:-http://promotion-service:5006}
    ports:
      - "${ORDER_PORT:-5005}:${ORDER_PORT:-5005}"
    depends_on:
      - rabbitmq
    restart: unless-stopped
    networks:
      - appnet

  delivery-service:
    build:
      context: ./delivery-service/backend
    container_name: delivery-service
    env_file:
      - .env
    environment:
      PORT: ${DELIVERY_PORT:-5003}
      MONGO_URI: ${DELIVERY_MONGO_URI}
      DELIVERY_DB_NAME: ${DELIVERY_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      REALTIME_SERVICE_URL: ${REALTIME_URL:-http://realtime-gateway:5050}
      SERVICE_INTERNAL_KEY: ${SERVICE_INTERNAL_KEY:-super-admin-internal-key}
      RABBITMQ_URL: amqp://rabbitmq:5672
    ports:
      - "${DELIVERY_PORT:-5003}:${DELIVERY_PORT:-5003}"
    depends_on:
      - rabbitmq
    restart: unless-stopped
    networks:
      - appnet

  payment-service:
    build:
      context: ./backend/payment-service
    container_name: payment-service
    env_file:
      - .env
    environment:
      PORT: ${PAY_PORT:-5004}
      MONGO_URI: ${PAYMENT_MONGO_URI}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      RESEND_API_KEY: ${RESEND_API_KEY}
      NODE_ENV: production
      RABBITMQ_URL: amqp://rabbitmq:5672
    ports:
      - "${PAY_PORT:-5004}:${PAY_PORT:-5004}"
    depends_on:
      - rabbitmq
    restart: unless-stopped
    networks:
      - appnet

  promotion-service:
    build:
      context: ./backend/promotion-service
    container_name: promotion-service
    env_file:
      - .env
    environment:
      PORT: ${PROMOTION_PORT:-5006}
      NODE_ENV: production
      RABBITMQ_URL: amqp://rabbitmq:5672
    ports:
      - "${PROMOTION_PORT:-5006}:${PROMOTION_PORT:-5006}"
    depends_on:
      - rabbitmq
    restart: unless-stopped
    networks:
      - appnet

  settlement-service:
    build:
      context: ./backend/settlement-service
    container_name: settlement-service
    env_file:
      - .env
    environment:
      PORT: ${SETTLEMENT_PORT:-5007}
      NODE_ENV: production
      RABBITMQ_URL: amqp://rabbitmq:5672
      SETTLEMENT_PERIOD: ${SETTLEMENT_PERIOD:-day}
    ports:
      - "${SETTLEMENT_PORT:-5007}:${SETTLEMENT_PORT:-5007}"
    depends_on:
      - rabbitmq
    restart: unless-stopped
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    depends_on:
      - auth-service
      - restaurant-service
      - order-service
      - payment-service
      - delivery-service
      - realtime-gateway
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - appnet

  delivery-frontend:
    build:
      context: ./delivery-service/frontend
    container_name: delivery-frontend
    depends_on:
      - delivery-service
    ports:
      - "3001:80"
    restart: unless-stopped
    networks:
      - appnet

  realtime-gateway:
    build:
      context: ./backend/realtime-gateway
    container_name: realtime-gateway
    env_file:
      - .env
    environment:
      PORT: ${REALTIME_PORT:-5050}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_INTERNAL_KEY: ${SERVICE_INTERNAL_KEY:-super-admin-internal-key}
      NODE_ENV: production
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      - redis
      - rabbitmq
    ports:
      - "${REALTIME_PORT:-5050}:${REALTIME_PORT:-5050}"
    restart: unless-stopped
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
